<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Disaster Mapping and Relief Management System logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a3550"/>
      <stop offset="0.55" stop-color="#0f6b8f"/>
      <stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- map grid (mapping) -->
    <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="2">
      <path d="M0 128H512M0 256H512M0 384H512M128 0V512M256 0V512M384 0V512"/>
    </g>
    <!-- cyclone: three spiral arms -->
    <g transform="translate(256 226)" fill="none" stroke-linecap="round">
      <g id="arm" stroke="#ffffff" stroke-width="30">
        <path d="M0,-58 C86,-86 170,-24 150,70 C140,118 96,150 40,150" stroke-opacity="1"/>
      </g>
      <use href="#arm" transform="rotate(120)" opacity="0.88"/>
      <use href="#arm" transform="rotate(240)" opacity="0.76"/>
    </g>
    <!-- eye with a shelter -->
    <circle cx="256" cy="226" r="62" fill="#0a3550"/>
    <circle cx="256" cy="226" r="62" fill="none" stroke="#ffffff" stroke-width="6"/>
    <path d="M256 186 L296 220 H284 V258 H228 V220 H216 Z" fill="#ffffff"/>
    <rect x="245" y="232" width="22" height="26" rx="3" fill="#0f6b8f"/>
    <!-- relief: waves + cross -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="12">
      <path d="M96 420 q40 -34 80 0 t80 0 t80 0 t80 0" stroke-opacity="0.95"/>
      <path d="M96 452 q40 -34 80 0 t80 0 t80 0 t80 0" stroke-opacity="0.45"/>
    </g>
  </g>
</svg>
